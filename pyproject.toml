[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-schema-parsing"
version = "0.0.1"
description = "Resilient schema-driven PDF and Markdown section parser"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
pymupdf = ["pymupdf>=1.23"]
dev = ["pytest>=7.0", "pymupdf>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
